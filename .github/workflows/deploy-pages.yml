name: Deploy Factory OS to GitHub Pages

on:
  push:
    branches:
      - ui/modern-command-center
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: factory-os-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: Build production bundle
        run: bun run build

      - name: Verify production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html

          echo "--- dist/index.html ---"
          cat dist/index.html
          echo "-----------------------"

          if grep -Eq 'src=["'"']/?src/main\.tsx' dist/index.html; then
            echo "ERROR: dist/index.html still references src/main.tsx"
            exit 1
          fi

          if ! grep -q '/Factory-OS/assets/' dist/index.html; then
            echo "ERROR: GitHub Pages base path /Factory-OS/assets/ is missing"
            exit 1
          fi

          asset_count=$(find dist/assets -type f 2>/dev/null | wc -l)
          if [ "$asset_count" -lt 1 ]; then
            echo "ERROR: no production assets were generated"
            exit 1
          fi

          echo "Verified: production artifact contains $asset_count asset file(s)."
          echo "FACTORY_OS_COMMIT=${GITHUB_SHA}" > dist/deployment.txt
          echo "FACTORY_OS_BUILD=production" >> dist/deployment.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy verified artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
